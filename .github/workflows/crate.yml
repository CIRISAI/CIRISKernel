name: crate

# crates/ciris-kernel on its own: formatting, lints, tests, fixtures current, no_std and wasm builds, the
# minimum supported Rust version, and cargo-deny under persist's licence policy.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR: a newer push cancels the run of an older one, whose tree the newer one holds.
# A push runs on main only; a branch is checked through its pull request, so a PR's commit runs once, not twice
# (CIRISHolon's verify.yml, added after 29 queued runs held the organisation's shared runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MSRV: '1.89'

# Every job has a timeout: a hung job otherwise runs to GitHub's six-hour default. Each is about twice the
# job's longest run so far.
jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p ciris-kernel --check
      - run: cargo clippy --offline -p ciris-kernel --all-targets -- -D warnings

  test:
    name: cargo test --release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --offline --release -p ciris-kernel
      - run: bash tools/kernel_conformance.sh

  # The planted breaks, split over six runners. Each plant is a release rebuild and the whole test suite; run
  # one after another (54 on 2026-11-22) they took 29 to 44 minutes inside each of two jobs, this workflow's
  # test job and ci.yml's ./check.sh, and on the slower runners took the latter past its 75 minutes. The
  # shards between them run every plant once (tools/kernel_crate_plants.sh, PLANTS_SHARD). A reviewer's
  # ./check.sh still runs them all. Six shards since 2026-11-25: at about 120 plants a shard of four ran 34 to
  # 36 minutes and one passed its 45. 2026-11-26: at about 160 plants, each near 100 s on a runner, a shard of
  # six ran 41 minutes and was cancelled at its 45 with no plant run long (#48, shard 3): the limit is 70 (the
  # job names, and so any required checks, are unchanged).
  plants:
    name: plants (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash tools/kernel_crate_plants.sh
        env:
          PLANTS_SHARD: ${{ matrix.shard }}/6

  fixtures:
    name: fixtures current (regenerate, then git diff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('tools/kernel_fixtures.py') }}
      - run: python3 -I tools/kernel_fixtures.py
      - run: git diff --exit-code -- crates/ciris-kernel/tests/fixtures

  nostd:
    name: no_std and wasm builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --offline --release -p ciris-kernel --target thumbv7em-none-eabihf
      - run: cargo build --offline --release -p ciris-kernel --target wasm32-unknown-unknown

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: The MSRV stated in Cargo.toml is the one built here
        run: grep -qx "rust-version = \"$MSRV\"" crates/ciris-kernel/Cargo.toml
      - run: cargo build --offline -p ciris-kernel
      - run: cargo test --offline --release -p ciris-kernel

  deny:
    name: cargo deny (persist's licence policy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
