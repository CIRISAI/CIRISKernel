name: check

# Compiles every proof in proofs/ and runs every model check in models/, by the one command a reviewer runs.
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  check:
    name: proofs and models (./check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean 4.14.0 (elan)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the proofs and run the checks
        run: ./check.sh
      - name: The working tree is unchanged by the run
        run: git diff --exit-code
