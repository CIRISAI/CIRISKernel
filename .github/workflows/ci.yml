name: check

# The one command a reviewer runs: every proof in proofs/, every model check in models/ (TLC for models/tla/),
# and the Rust crate
# crates/ciris-kernel built for a target with no standard library and checked against the models' own cases.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR: a newer push cancels the run of an older one, whose tree the newer one holds.
# A push runs on main only; a branch is checked through its pull request, so a PR's commit runs once, not twice
# (CIRISHolon's verify.yml, added after 29 queued runs held the organisation's shared runners).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: proofs, models and crate (./check.sh)
    runs-on: ubuntu-latest
    # Raised 45 -> 75 on 2026-11-21, from the clock. The plants step alone took 1,730 s (29 min) on 2026-11-20
    # (49 plants, each a release rebuild and the whole test suite); with eight TLA specs and 31 proof files the job
    # then ran past 45 minutes twice, cancelled, with no step failed. This is a budget, not a fix: the plants are
    # independent and want running in parallel, each with a target directory of its own.
    # 2026-11-22: done across runners. The plants are crate.yml's four `plants` jobs, and this job skips the step
    # (CHECK_SKIP_PLANTS). The budget is left at 75 until the clock shows what the job now takes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip (the checks use the standard library only; this keeps the runner's cache warm)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('check.sh') }}
      - name: Cache Lean 4.14.0
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-lean-4.14.0
      - name: Install Lean 4.14.0 (elan)
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain leanprover/lean4:v4.14.0
      - name: Put Lean on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache tla2tools v1.7.4 (the pinned TLC)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ciris-kernel
          key: tla2tools-1.7.4-936a262061c9
      - name: Build the proofs, run the checks, model-check the specs, build and test the crate
        run: ./check.sh
        env:
          CHECK_SKIP_PLANTS: 1
      - name: The working tree is unchanged by the run
        run: git diff --exit-code
