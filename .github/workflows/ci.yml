name: check

# The one command a reviewer runs: every proof in proofs/, every model check in models/, and the Rust crate
# crates/ciris-kernel built for a target with no standard library and checked against the models' own cases.
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: proofs, models and crate (./check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip (the checks use the standard library only; this keeps the runner's cache warm)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('check.sh') }}
      - name: Cache Lean 4.14.0
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-lean-4.14.0
      - name: Install Lean 4.14.0 (elan)
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain leanprover/lean4:v4.14.0
      - name: Put Lean on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the proofs, run the checks, build and test the crate
        run: ./check.sh
      - name: The working tree is unchanged by the run
        run: git diff --exit-code
