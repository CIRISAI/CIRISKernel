# cargo-deny policy for the ciris-kernel crate. The licence allow-list is CIRISPersist's own (its deny.toml),
# so a crate that passes here passes there. The crate has no dependencies; this file keeps it that way unless a
# dependency's licence is one persist also accepts.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "OpenSSL",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.85
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
